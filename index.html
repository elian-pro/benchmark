<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zebra Benchmarking - Intelligence Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Identity Services: login con Google restringido por dominio -->
    <script src="https://accounts.google.com/gsi/client" async></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Design System de Zebra: Inter (texto) + JetBrains Mono (eyebrows/labels) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Puente Tailwind -> tokens del Design System (theme-aware via [data-ds-theme]) -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: 'var(--bg)',
              surface: 'var(--surface)',
              'surface-2': 'var(--surface-2)',
              text: 'var(--text)',
              muted: 'var(--text-muted)',
              accent: 'var(--accent)',
              line: 'var(--border)',
              'line-strong': 'var(--border-strong)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            borderRadius: {
              chip: 'var(--r-chip)',
              control: 'var(--r-control)',
              input: 'var(--r-input)',
              btn: 'var(--r-btn)',
              card: 'var(--r-card)',
              pill: 'var(--r-pill)',
            },
            boxShadow: {
              sm: 'var(--shadow-sm)',
              md: 'var(--shadow-md)',
              lg: 'var(--shadow-lg)',
              xl: 'var(--shadow-xl)',
              '2xl': 'var(--shadow-2xl)',
            },
          },
        },
      };
    </script>
    <!-- Tema inicial sin parpadeo: localStorage > preferencia del sistema (ZR-21) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ZEBRA_THEME');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          if (theme === 'dark') document.documentElement.setAttribute('data-ds-theme', 'dark');
        } catch (e) {}
      })();
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background-color .3s ease, color .3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* Reduced-motion: el contenido se revela igual, solo se anula la transición (ZR-27) */
        @media (prefers-reduced-motion: reduce) {
            .animate-fade-in { animation: none; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@anthropic-ai/sdk": "https://esm.sh/@anthropic-ai/sdk@^0.110.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
